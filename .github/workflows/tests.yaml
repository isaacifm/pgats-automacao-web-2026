name: Web E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e-tests:

    runs-on: ubuntu-latest

    steps:

      # clone do projeto para a máquina
      - uses: actions/checkout@v4

      # Instala uma versão fixa do Node e guarda o cache do npm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instala exatamente as versões do package-lock.json
      - name: Instalando dependências
        run: npm ci

      - name: Executando os testes
        run: npx cypress run --spec cypress/e2e/automation-exercise-modules.cy.js

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            cypress/reports
            cypress/screenshots
